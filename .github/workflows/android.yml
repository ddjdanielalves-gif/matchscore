name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]


env:
  API_URL: ${{ vars.API_URL }}
  KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}


jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      - uses: android-actions/setup-android@v3


      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend


      - name: Build web assets (VITE_API_URL embeds the backend URL)
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.API_URL }}


      - name: Generate Android project
        run: npx cap add android
        working-directory: frontend
        env:
          CI: "true"


      - name: Generate custom Android icon
        run: npx --yes @capacitor/assets@3 generate --android --assetPath resources --iconBackgroundColor '#ffffff'
        working-directory: frontend


      - name: Sync web assets
        run: npx cap sync android
        working-directory: frontend


      - name: Create signing keystore
        working-directory: frontend/android
        run: |
          PASS="${KEYSTORE_PASS:-matchscore123}"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
          else
            keytool -genkeypair -v -keystore release.keystore -storepass "$PASS" \
              -alias matchscore -keyalg RSA -keysize 2048 -validity 10950 \
              -keypass "$PASS" \
              -dname "CN=MatchScore, OU=Mobile, O=MatchScore, L=Sao Paulo, ST=SP, C=BR"
          fi
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=matchscore\nkeyPassword=%s\n' \
            "release.keystore" "$PASS" "$PASS" > key.properties
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}


      - name: Configure release signing
        run: python scripts/configure_android_signing.py frontend/android


      - name: Build release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease


      - name: Verify signature
        working-directory: frontend/android
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: matchscore-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk


      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: MatchScore APK
          files: frontend/android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: false
          fail_on_unmatched_files: truename: Build Android APK
